<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 인프라 브리핑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0B0F14;
    --panel:#121820;
    --line:#212B34;
    --text:#E7ECF1;
    --muted:#7C8896;
    --amber:#E8A33D;
    --cyan:#4FD1C5;
    --rose:#E88A9A;
    --violet:#A78BFA;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(232,163,61,0.08), transparent 60%),
      radial-gradient(1000px 500px at 85% 0%, rgba(79,209,197,0.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .wrap{max-width:900px;margin:0 auto;padding:0 20px;}

  header{border-bottom:1px solid var(--line);padding:20px 0 12px;}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:0.14em;
    color:var(--muted);text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  h1{font-size:clamp(24px,5vw,36px);line-height:1.2;margin:0 0 6px;font-weight:700;}
  .subtitle{color:var(--muted);font-size:14px;margin:0;line-height:1.6;}

  .label-cloud{display:none;flex-wrap:wrap;gap:8px;padding:10px 0 2px;}
  .label-cloud.expanded{display:flex;}

  .label-toggle{
    display:flex;align-items:center;gap:6px;
    margin-top:10px;padding:6px 0;
    background:none;border:none;cursor:pointer;
    font-family:var(--mono);font-size:12px;color:var(--muted);
  }
  .label-toggle:hover{color:var(--text);}
  .label-toggle .chevron{transition:transform 0.15s ease;display:inline-block;}
  .label-toggle.expanded .chevron{transform:rotate(180deg);}
  .label-chip{
    font-family:var(--mono);font-size:12px;padding:5px 11px;border-radius:20px;
    border:1px solid var(--line);color:var(--muted);
    background:var(--panel);white-space:nowrap;cursor:pointer;
    transition:all 0.12s ease;
  }
  .label-chip .count{opacity:0.7;margin-left:4px;}
  .label-chip:hover{border-color:var(--amber);}
  .label-chip.active{
    color:var(--amber);border-color:var(--amber);
    background:rgba(232,163,61,0.14);
  }
  .label-chip.all-chip{
    color:var(--text);border-color:var(--line);font-weight:600;
  }
  .label-chip.all-chip.active{
    color:var(--cyan);border-color:var(--cyan);background:rgba(79,209,197,0.12);
  }
  .label-chip.freq-high{ font-weight:700; }

  .tabs{
    display:flex;gap:2px;
    margin-top:14px;padding:0;
  }
  .tab-btn{
    flex:1;font-family:'Pretendard',sans-serif;font-size:17px;font-weight:700;
    padding:12px 8px;background:none;border:none;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .tab-btn .tab-count{
    font-family:var(--mono);font-weight:600;font-size:15px;
    color:var(--cyan);opacity:0.9;
    display:block;margin:6px 0 0;
  }
  .tab-btn.active{color:var(--text);}
  .tab-btn.active{border-color:var(--amber);}

  .panel{display:none;padding-top:8px;}
  .panel.tab-active{display:block;}
  .empty-note{font-family:var(--mono);font-size:12px;color:var(--muted);padding:20px 2px;}

  /* 요약 팝업 모달 */
  .modal-backdrop{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,0.6);
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-backdrop.on{display:flex;}
  .modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    max-width:560px;width:100%;max-height:80vh;overflow-y:auto;
    padding:24px 24px 20px;position:relative;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:20px;line-height:1;padding:4px;
  }
  .modal-close:hover{color:var(--text);}
  .modal-title{font-size:17px;font-weight:700;line-height:1.4;margin:0 26px 14px 0;}
  .modal-body{font-size:14px;color:var(--text);line-height:1.7;margin:0 0 16px;}
  .modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .item-tag{
    font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:10px;
    background:var(--bg);border:1px solid var(--line);color:var(--muted);
  }
  .modal-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:11px;color:var(--muted);
    padding-top:14px;border-top:1px solid var(--line);
  }
  .modal-original-link{color:var(--cyan);text-decoration:none;font-family:var(--mono);font-size:12px;}
  .modal-original-link:hover{text-decoration:underline;}

  .item{padding:16px 2px;border-top:1px solid var(--line);}
  .item.js-hidden{display:none;}
  .item-title{font-size:15px;font-weight:600;line-height:1.45;margin:0 0 10px;}
  .item-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .item-date{opacity:0.6;margin-right:8px;}
  .item-actions{display:flex;gap:6px;}
  .item-btn{
    font-family:var(--mono);font-size:11px;
    padding:5px 12px;border-radius:6px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    transition:border-color 0.12s ease, color 0.12s ease;
  }
  .item-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .item-btn.original{color:var(--muted);}
  .item-btn.original:hover{border-color:var(--text);color:var(--text);}

  .load-more-wrap{padding:20px 2px 8px;text-align:center;}
  .load-more-btn{
    font-family:var(--mono);font-size:12.5px;
    padding:10px 20px;border-radius:8px;
    background:var(--panel);border:1px solid var(--line);
    color:var(--text);cursor:pointer;
  }
  .load-more-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .load-more-btn.js-gone{display:none;}

  .filter-bar{
    display:none;
    align-items:center;justify-content:space-between;
    padding:12px 0;margin-top:20px;
    border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
  }
  .filter-bar.on{display:flex;}
  .filter-bar .clear-btn{
    color:var(--cyan);cursor:pointer;background:none;border:none;
    font-family:var(--mono);font-size:12.5px;
  }

  .loading-note{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
    padding:40px 2px;text-align:center;
  }

  footer{
    max-width:900px;margin:36px auto 0;padding:20px 20px 0;
    border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7;
  }
  footer code{font-family:var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--cyan);}

  @media (max-width:520px){
    .tab-btn{font-size:15px;padding:12px 4px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span><span id="lastUpdated">최종 업데이트 : 불러오는 중...</span></div>
      <h1>오늘의 브리핑</h1>

      <button class="label-toggle" id="labelToggle">
        레이블 필터 <span id="labelToggleCount"></span> <span class="chevron">▾</span>
      </button>
      <div class="label-cloud" id="labelCloud"></div>
    </header>

    <div class="filter-bar" id="filterBar">
      <span id="filterBarText">필터: #HBM</span>
      <button class="clear-btn" id="clearFilterBtn">✕ 전체기사로 돌아가기</button>
    </div>

    <div class="tabs" id="tabBar">
      <button class="tab-btn active" data-tab="bottleneck">병목 <span class="tab-count">0</span></button>
      <button class="tab-btn" data-tab="tech">돌파기술 <span class="tab-count">0</span></button>
      <button class="tab-btn" data-tab="service">수익화 <span class="tab-count">0</span></button>
      <button class="tab-btn" data-tab="other">병목(그외) <span class="tab-count">0</span></button>
    </div>

    <div class="panel tab-active" id="panel-bottleneck" data-page-size="10" data-category-name="병목">
      <div class="item-list"><p class="loading-note">기사를 불러오는 중...</p></div>
      <div class="load-more-wrap">
        <button class="load-more-btn js-gone">더보기</button>
      </div>
    </div>

    <div class="panel" id="panel-tech" data-page-size="10" data-category-name="돌파기술">
      <div class="item-list"></div>
      <div class="load-more-wrap">
        <button class="load-more-btn js-gone">더보기</button>
      </div>
    </div>

    <div class="panel" id="panel-service" data-page-size="10" data-category-name="수익화">
      <div class="item-list"></div>
      <div class="load-more-wrap">
        <button class="load-more-btn js-gone">더보기</button>
      </div>
    </div>

    <div class="panel" id="panel-other" data-page-size="10" data-category-name="병목(그외)">
      <div class="item-list"></div>
      <div class="load-more-wrap">
        <button class="load-more-btn js-gone">더보기</button>
      </div>
    </div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-card">
        <button class="modal-close" id="modalClose">✕</button>
        <p class="modal-title" id="modalTitle"></p>
        <p class="modal-body" id="modalBody"></p>
        <div class="modal-tags" id="modalTags"></div>
        <div class="modal-meta">
          <span id="modalMeta"></span>
          <a class="modal-original-link" id="modalOriginalLink" href="#" target="_blank">원문 보기 →</a>
        </div>
      </div>
    </div>

    <footer>
      <p>매일 자동으로 새 기사가 누적되는 브리핑입니다. 요약은 원문을 재구성한 것이며, 정확한 수치·맥락은 각 기사 원문에서 확인하세요.</p>
      <p>데이터는 <code>data/articles.json</code>에 계속 누적됩니다.</p>
    </footer>
  </div>

<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function openSummaryModal(article) {
    document.getElementById('modalTitle').textContent = article.title;
    document.getElementById('modalBody').textContent = article.summary;
    document.getElementById('modalMeta').textContent = `${article.date || ''} · ${article.source || ''}`;
    document.getElementById('modalOriginalLink').href = article.url;

    const tagsEl = document.getElementById('modalTags');
    tagsEl.innerHTML = (article.labels || [])
      .map(l => `<span class="item-tag">#${escapeHtml(l)}</span>`)
      .join('');

    document.getElementById('modalBackdrop').classList.add('on');
  }

  function closeSummaryModal() {
    document.getElementById('modalBackdrop').classList.remove('on');
  }

  function buildItemEl(article) {
    const div = document.createElement('div');
    div.className = 'item';
    if (article.labels && article.labels.length) {
      div.dataset.labels = article.labels.join(',');
    }

    div.innerHTML = `
      <p class="item-title">${escapeHtml(article.title)}</p>
      <div class="item-meta">
        <span><span class="item-date">${escapeHtml(article.date || '')}</span>${escapeHtml(article.source || '')}</span>
        <span class="item-actions">
          <button class="item-btn summary">요약</button>
          <button class="item-btn original">원문보기</button>
        </span>
      </div>
    `;

    div.querySelector('.item-btn.summary').addEventListener('click', () => openSummaryModal(article));
    div.querySelector('.item-btn.original').addEventListener('click', () => window.open(article.url, '_blank'));

    return div;
  }

  const CATEGORY_TO_PANEL = {
    bottleneck: 'panel-bottleneck',
    tech: 'panel-tech',
    service: 'panel-service',
    other: 'panel-other'
  };

  async function init() {
    let articles = [];
    try {
      const res = await fetch('data/articles.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed');
      articles = await res.json();
    } catch (e) {
      document.querySelectorAll('.item-list').forEach(el => {
        el.innerHTML = '<p class="empty-note">데이터를 불러오지 못했습니다. data/articles.json 파일을 확인하세요.</p>';
      });
      return;
    }

    articles.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const latestDate = articles.length ? articles[0].date : '-';
    document.getElementById('lastUpdated').textContent = '최종 업데이트 : ' + latestDate;

    Object.entries(CATEGORY_TO_PANEL).forEach(([cat, panelId]) => {
      const panel = document.getElementById(panelId);
      const list = panel.querySelector('.item-list');
      list.innerHTML = '';
      const items = articles.filter(a => a.category === cat);
      if (items.length === 0) {
        list.innerHTML = '<p class="empty-note">아직 수집된 기사가 없습니다.</p>';
      } else {
        items.forEach(article => list.appendChild(buildItemEl(article)));
      }
    });

    const freq = {};
    articles.forEach(a => {
      if (a.category === 'service') return;
      (a.labels || []).forEach(l => { freq[l] = (freq[l] || 0) + 1; });
    });
    const sortedLabels = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 20);

    const labelCloud = document.getElementById('labelCloud');
    labelCloud.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'label-chip all-chip';
    allChip.dataset.label = '__ALL__';
    allChip.textContent = '전체기사';
    labelCloud.appendChild(allChip);

    sortedLabels.forEach(([label, count]) => {
      const chip = document.createElement('button');
      chip.className = 'label-chip' + (count >= 3 ? ' freq-high' : '');
      chip.dataset.label = label;
      chip.innerHTML = `#${escapeHtml(label)}<span class="count">×${count}</span>`;
      labelCloud.appendChild(chip);
    });

    const labelToggle = document.getElementById('labelToggle');
    document.getElementById('labelToggleCount').textContent = `(${sortedLabels.length}개)`;
    labelToggle.addEventListener('click', () => {
      labelCloud.classList.toggle('expanded');
      labelToggle.classList.toggle('expanded');
    });

    setupInteractions();
  }

  function setupInteractions() {
    const tabBar = document.getElementById('tabBar');
    const filterBar = document.getElementById('filterBar');
    const filterBarText = document.getElementById('filterBarText');
    const clearFilterBtn = document.getElementById('clearFilterBtn');
    const labelChips = Array.from(document.querySelectorAll('.label-chip'));
    const panels = Array.from(document.querySelectorAll('.panel'));
    const activeLabels = new Set();

    panels.forEach(panel => {
      const tabKey = panel.id.replace('panel-', '');
      const btn = document.querySelector('.tab-btn[data-tab="' + tabKey + '"] .tab-count');
      const total = panel.querySelectorAll('.item-list .item').length;
      if (btn) btn.textContent = total;
    });

    panels.forEach(panel => {
      const pageSize = parseInt(panel.dataset.pageSize || '10', 10);
      const items = Array.from(panel.querySelectorAll('.item-list .item'));
      const loadMoreBtn = panel.querySelector('.load-more-btn');
      let shown = 0;

      function reveal() {
        const next = items.slice(shown, shown + pageSize);
        next.forEach(el => el.classList.remove('js-hidden'));
        shown += next.length;
        if (shown >= items.length) {
          loadMoreBtn.classList.add('js-gone');
        } else {
          loadMoreBtn.classList.remove('js-gone');
        }
      }

      items.forEach(el => el.classList.add('js-hidden'));
      reveal();
      loadMoreBtn.addEventListener('click', reveal);

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting && !loadMoreBtn.classList.contains('js-gone') && activeLabels.size === 0) {
            reveal();
          }
        });
      }, { rootMargin: '200px' });
      observer.observe(loadMoreBtn);
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (activeLabels.size > 0) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        panels.forEach(p => p.classList.remove('tab-active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('tab-active');
      });
    });

    labelChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const label = chip.dataset.label;
        if (label === '__ALL__') {
          activeLabels.clear();
        } else {
          if (activeLabels.has(label)) activeLabels.delete(label);
          else activeLabels.add(label);
        }
        render();
      });
    });
    clearFilterBtn.addEventListener('click', () => {
      activeLabels.clear();
      render();
    });

    function render() {
      const filtering = activeLabels.size > 0;

      labelChips.forEach(chip => {
        const label = chip.dataset.label;
        if (label === '__ALL__') chip.classList.toggle('active', !filtering);
        else chip.classList.toggle('active', activeLabels.has(label));
      });

      filterBar.classList.toggle('on', filtering);
      tabBar.style.display = filtering ? 'none' : 'flex';
      if (filtering) {
        filterBarText.textContent = '필터: ' + Array.from(activeLabels).map(l => '#' + l).join(' ');
      }

      if (!filtering) {
        panels.forEach(panel => {
          const isActiveTab = document.querySelector('.tab-btn.active').dataset.tab === panel.id.replace('panel-', '');
          panel.classList.toggle('tab-active', isActiveTab);
          panel.querySelectorAll('.load-more-wrap').forEach(w => w.style.display = '');
        });
        return;
      }

      ['panel-bottleneck', 'panel-tech'].forEach(id => {
        const panel = document.getElementById(id);
        panel.classList.add('tab-active');
        panel.querySelectorAll('.load-more-wrap').forEach(w => w.style.display = 'none');
        panel.querySelectorAll('.item-list .item').forEach(item => {
          const itemLabels = (item.dataset.labels || '').split(',').map(s => s.trim()).filter(Boolean);
          const match = itemLabels.some(l => activeLabels.has(l));
          item.classList.toggle('js-hidden', !match);
        });
      });
      document.getElementById('panel-service').classList.remove('tab-active');
      document.getElementById('panel-other').classList.remove('tab-active');
    }

    render();
  }

  document.getElementById('modalClose').addEventListener('click', closeSummaryModal);
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') closeSummaryModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSummaryModal();
  });

  init();
</script>
</body>
</html>
